<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafcfd">
  <title>BuddyPilot - Tiada sambungan</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100dvh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background: #f3f6f8;
      color: #17212b;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { width: min(340px, 100%); }
    img { border-radius: 18px; }
    h1 { margin: 16px 0 6px; font-size: 22px; }
    p { margin: 0 0 20px; color: #5b6875; }
    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: #0f62d6;
      color: #fff;
      font: inherit;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/app-icon-96x96.png" alt="" width="72" height="72">
    <h1>Tiada sambungan internet</h1>
    <p>BuddyPilot perlukan internet untuk ambil data terkini. Semak sambungan kau, kemudian cuba lagi.</p>
    <button type="button" onclick="location.reload()">Cuba lagi</button>
  </main>
</body>
</html>
