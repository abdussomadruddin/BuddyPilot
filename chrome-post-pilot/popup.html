<!doctype html>
<html lang="ms">
<meta charset="utf-8">
<title>BuddyPilot Post Pilot</title>
<style>
  body { width: 260px; margin: 16px; color: #17212a; font: 14px system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0; }
  p { min-height: 40px; line-height: 1.45; }
  div { display: flex; gap: 8px; }
  button { min-height: 38px; padding: 0 10px; border: 1px solid #bac7d3; border-radius: 6px; background: #fff; color: inherit; }
  button:disabled { opacity: .55; }
  form { display: grid; gap: 6px; margin-top: 16px; }
  input { min-width: 0; padding: 8px; }
</style>
<h1>BuddyPilot Post Pilot</h1>
<p id="status" role="status">Menyemak...</p>
<div>
  <button id="toggle" disabled>Aktifkan</button>
  <button id="check" disabled>Semak sekarang</button>
</div>
<form id="threads-account">
  <label for="threads-username">Username Threads untuk auto-post</label>
  <input id="threads-username" placeholder="@username" maxlength="31" autocomplete="off" autocapitalize="none">
  <button type="submit">Simpan akaun Threads</button>
</form>
<script src="popup.js" defer></script>
</html>
